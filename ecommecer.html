<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual</title>
    <link rel="stylesheet" href="Projeto/FRONTEND/HTML/FRONTEND/CSS/ecommecer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
 
<body>
    <div class="botoes-flutuantes">
    <a href="https://wa.me/message/FN3T4IDAGHELH1" class="botao-flutuante" id="whatsapp" aria-label="Falar no WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
    <a href="https://github.com/MarcosSilvari" class="botao-flutuante" id="github" aria-label="github"><i class="fa-brands fa-github"></i></a>
</div>

    <header>
        <h1>Loja Virtual</h1>
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Pesquisar" id="pesquisar">
 
        <ul>
            <li><a href="#">Produtos</a></li>
            <li><a href="#">Categorias</a></li>
            <li><a href="home.html">Inicio</a></li>
        </ul>
 
        <button type="button" id="carrinho">
            <i class="fa-solid fa-cart-shopping"></i>Carrinho <span id="contador-carrinho">0</span>
        </button>
    </header>
 
    <section id="produtos">
        <h2><i class="fa-brands fa-product-hunt"></i> Produtos em Destaque</h2>
 
        <select id="filtro">
            <option value="todos">Todas as categorias</option>
        </select>
 
        <div id="lista-produtos"></div>
    </section>
 
    <div id="overlay-carrinho" class="overlay-carrinho" aria-hidden="true">
        <section class="caixa-carrinho" role="dialog" aria-modal="true" aria-labelledby="titulo-carrinho">
            <button type="button" id="fechar-carrinho" class="fechar-carrinho" aria-label="Fechar carrinho">✕</button>
            <h2 id="titulo-carrinho"><i class="fa-solid fa-cart-shopping"></i> Carrinho:</h2>
            <ul id="itens-carrinho"></ul>
            <p>Total compras: <span id="total-compras"></span></p>
        </section>
    </div>
 
    <script src="Projeto/FRONTEND/HTML/FRONTEND/JS/ecommecer.js"></script>
</body>
 
</html>
