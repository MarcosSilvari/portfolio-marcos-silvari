<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esfera Neon</title>
<link rel="stylesheet" href="Projeto/FRONTEND/HTML/FRONTEND/CSS/esfera.css">
</head>
<body>

  <!-- href = para onde vai depois do clique. Troque pelo endereço da sua página inicial -->
  <a class="link" id="link" href="home.html" aria-label="Entrar no site">

    <!-- .orbe = caixa que guarda a esfera e todos os efeitos em volta dela -->
    <div class="orbe" id="orbe">

      <!-- Ondas de energia que se expandem para fora -->
      <div class="onda"></div>
      <div class="onda atraso"></div>

      <!-- Anéis de luz girando em volta (cada um em um sentido) -->
      <div class="anel anel1"></div>
      <div class="anel anel2"></div>

      <!-- Faíscas orbitando (cada .orbita gira e carrega uma bolinha de luz) -->
      <div class="orbita o1"></div>
      <div class="orbita o2"></div>
      <div class="orbita o3"></div>

      <!-- A esfera em si, com a energia por dentro -->
      <div class="esfera">
        <div class="plasma"></div>
        <div class="nucleo"></div>
        <div class="reflexo"></div>
      </div>

      <!-- Texto no centro da esfera (fica por cima de tudo) -->
      <span class="entrar">ENTRAR</span>

    </div>
  </a>

<script src="Projeto/FRONTEND/HTML/FRONTEND/JS/esfera.js"></script>

</body>
</html>
